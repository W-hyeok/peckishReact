server {
    listen 80;
    listen [::]:80;
    server_name hungrymoment.store www.hungrymoment.store;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
    
    access_log /var/log/nginx/access.log main;
}

server {
    listen 443 ssl;
    server_name hungrymoment.store www.hungrymoment.store;
    ssl_certificate /etc/letsencrypt/live/hungrymoment.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hungrymoment.store/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 인증 헤더 정보 백앤드로 전달하기
        proxy_pass_header Authorization;
        proxy_set_header Authorization $http_authorization;
        # 외부이미지 cors 설정
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        # add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    }

    location /room/ {
        proxy_pass http://backend/room/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 인증 헤더 정보 백앤드로 전달하기
        proxy_pass_header Authorization;
        proxy_set_header Authorization $http_authorization;
        # 외부이미지 cors 설정
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        # add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    }

    location /chat/ {
        proxy_pass http://backend/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 인증 헤더 정보 백앤드로 전달하기
        proxy_pass_header Authorization;
        proxy_set_header Authorization $http_authorization;
        # 외부이미지 cors 설정
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        # add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    }

    # 로그
    access_log /var/log/nginx/access.log main;
}
